services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
      # 前端产物不在仓库里（见 .gitignore），构建前请先执行：
      #   pnpm build:web
      # 需要换基础镜像时：
      #   docker compose build --build-arg NODE_IMAGE=node:20-alpine
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped

    ports:
      - "3007:3007"               # 管理面板
      - "18000-18999:18000-18999" # 抓包登录 MITM 代理端口池（iPhone Wi-Fi 代理连入）

    volumes:
      # 数据目录默认放在仓库外（重建镜像/重新 clone 都不丢数据）。
      # 需要复用仓库内的 core/data 时，在仓库根新建 .env 写：
      #   FARM_DATA_PATH=./core/data
      - ${FARM_DATA_PATH:-../data}:/app/core/data

    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      ADMIN_PORT: "3007"
      FARM_DATA_DIR: /app/core/data
      CAPTURE_ADVERTISE_IPS: "${CAPTURE_ADVERTISE_IPS:-auto}"
      # 管理员首次初始化（可选）：默认空值，未设置时正常启动，已有管理员数据不受影响
      FARM_ADMIN_USERNAME: "${FARM_ADMIN_USERNAME:-}"
      FARM_ADMIN_PASSWORD: "${FARM_ADMIN_PASSWORD:-}"
      # 抓包服务已嵌入本进程，无需单独启动；可按需调整代理端口池：
      # CAPTURE_PORTS: "18000-18999"
      # 需要固定对外地址时，在 .env 中设置（局域网 / Tailscale 可同时填写）：
      # CAPTURE_ADVERTISE_IPS=203.0.113.10,198.51.100.20

    healthcheck:
      # 同 core/Dockerfile：避开 IPv6 localhost 与需要认证的 /api/status。
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3007/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
