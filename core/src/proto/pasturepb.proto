// 牧场协议（gamepb.animalpb）
//
// 来源：2026-11-16 真机抓包（Gamepb.AnimalService + RanchService），
// 字段名与 field number 经两路交叉验证：
//   1. mcboot/game.js 里静态提取的 protobuf 定义（字段名明文）；
//   2. 实际 WS 帧解码 —— 请求体 TSDK 加密需解密，响应体明文。
//
// 已实测的方法（括号内为抓到的样本数）：
//   AnimalService.GetRanchDetail(16) FeedAnimal(6) HarvestRanch(2)
//                 StealProduce(1) TriggerProduce(2)
//   RanchService.CleanAllRanch(2) GetRanchOpTimes(1)
//
// 尚未抓到样本、字段按 mcboot 静态定义预留（标注 TODO）：
//   补栏 / 放进栏舍 / 扩建 capacity / 单个灾害处理。

syntax = "proto3";

package gamepb.animalpb;

// ─────────────────────────── 数据模型 ───────────────────────────

// 动物实例。字段编号 1..30 与 mcboot 静态定义完全一致，且每个字段都有抓包实例。
message AnimalInst {
    int64 ranch_inst_id = 1;              // 10001
    int32 slot_index = 2;                 // 栏位序号
    int64 animal_inst_id = 3;             // 7 / 8 / 11 / 12
    int64 animal_id = 4;                  // 60001 / 60002 / 60003（种类）
    int32 stage = 5;                      // 1 幼崽 2 成长 3 成熟 4 生产
    int32 produce_count = 6;              // 待收产物数量
    bool can_harvest = 7;                 // 可收获
    int64 grow_ready_at_ms = 10;          // 成长完成时间
    int64 produce_ready_at_ms = 11;       // 产物成熟时间（抢收墙钟）
    bool grass_blocked = 12;              // 缺草阻塞
    int64 infant_ready_at_ms = 14;
    bool producing = 15;
    bool can_deliver = 16;
    int64 delivering_until_ms = 17;
    bool can_feed = 18;                   // 可投喂
    bool limited_can_used = 19;
    bool can_donate = 20;
    int32 expected_harvest_exp = 21;      // 预期收获经验（360）
    repeated ItemAmount expected_harvest_sells = 22;   // 预期收获收益
    int32 expected_produce_exp = 23;      // 预期产物经验（180）
    repeated ItemAmount expected_produce_sells = 24;   // 预期产物收益
    int64 mature_ready_at_ms = 25;
    AnimalMutation mutation = 30;
}

message ItemAmount {
    int64 id = 1;       // item_id，例如 1007
    int64 count = 2;    // 2160
}

message AnimalMutation {
    int32 mutation_type = 1;
    int32 source = 2;
    int32 weight_display_x10 = 3;
    int32 scale_bp = 4;
    int32 weight_final_x10 = 5;
    int32 tier = 6;
    int64 became_at_ms = 7;
    bool strokable = 8;
    repeated int64 stroked_gids = 9;
}

message Grass {
    int32 amount = 1;
    int64 empty_at_ms = 2;
}

// 货架（产物寄存，可被好友偷）
message Shelf {
    int32 slot_index = 1;
    repeated ShelfLot lots = 2;
    int32 total_remain = 3;
    bool can_collect = 4;
    bool can_steal = 5;
}

message ShelfLot {
    int64 item_id = 1;
    int32 base_num = 2;
    int32 remain_num = 3;
    int32 stolen_num = 4;
    int64 animal_id = 5;
    bool can_steal = 6;
    repeated int64 stealers = 7;
}

message Hazard {
    int64 hazard_id = 1;
    int64 owner = 2;
    int32 hazard_type = 3;
}

message RanchInfo {
    int64 ranch_inst_id = 1;              // 10001
    int32 capacity = 2;                   // 4
    int32 animal_count = 3;               // 4
    repeated AnimalInst animals = 4;
    Grass grass = 5;
    int32 husbandry_type = 6;
    repeated Shelf shelves = 7;
    repeated Hazard hazards = 8;
}

// 操作次数配额
message OpQuota {
    int64 op_id = 1;          // 11003 / 11008 / 11009
    int32 times_limit = 2;    // 100 / 20 / 10
    int32 used_times = 3;
    int32 remaining_times = 4;
}

// ─────────────────────────── AnimalService ───────────────────────────

// GetRanchDetail —— 看自己的牧场时只有 2:ranch_inst_ids（可空）；
// 看好友牧场时 1:host_gid 是好友 gid（第二轮抓包确认：同一方法出现过 8 个不同 gid）。
message GetRanchDetailRequest {
    int64 host_gid = 1;                   // 空=自己
    repeated int64 ranch_inst_ids = 2;
}
message GetRanchDetailReply {
    repeated RanchInfo ranches = 1;
}

// FeedAnimal —— 请求 1:{ranch_inst_id, animal_inst_id} 2:<type>
message FeedAnimalTarget {
    int64 ranch_inst_id = 1;
    int64 animal_inst_id = 2;
}
message FeedAnimalRequest {
    repeated FeedAnimalTarget targets = 1;
    int32 feed_type = 2;      // 1/2 的具体分工仍未验证，但整体语义已经抓包确认：
                              // FeedAnimal 就是「喂罐头」本身。用户操作录像对应关系
                              // 7.83s FeedAnimal → 11.88s TriggerProduce → 14.92s HarvestRanch
                              // 与「喂罐头 → 催生产 → 收获鸡蛋」完全一致。
                              // 所以这个 RPC 不是免费投喂，自动调用等于花玩家的罐头。
                              // 免费路径是牧草机（homesteadpb.AddFeed），见 pasture_grass。
}
message FeedAnimalReply {
    repeated RanchInfo ranches = 1;
}

// HarvestRanch —— 请求 2:<empty> 3:1
message HarvestRanchRequest {
    repeated int64 ranch_inst_ids = 2;
    int32 harvest_type = 3;   // 抓到的取值 1
}
// field 5 实测是「本次收获明细」的重复消息（{1:ranch_inst_id, 2:?, 3:animal_inst_id, 10:{...}}），
// 内部结构未完全确认。这里不定义，交给 protobufjs 按未知字段跳过，
// 否则会被误当成 op_results 而错位（实测 invalid wire type 6）。
// 单次收获产出的物品（HarvestRanchReply.5.f10）
message RanchProduceItem {
    int64 item_id = 1;        // 1060001 = 鸡蛋（窝类 60001），1065001+ = 棚类产物
    int32 count = 2;          // 4
}

// 一次收获的产物汇总（HarvestRanchReply.5）
//   抓包：{1:10001(ranch_inst_id) 2:2 3:4 10:{1:1060001 2:4}}
message RanchProduce {
    int64 ranch_inst_id = 1;
    int32 unknown_2 = 2;
    int32 unknown_3 = 3;
    repeated RanchProduceItem items = 10;
}

message HarvestRanchReply {
    repeated RanchInfo ranches = 1;
    // 这次收获 / 捡蛋实际拿到的产物。之前只解析 1，导致永远不知道收获得到什么，
    // 也就无法出售、无法记账 —— 牧场余额只出不进的一半原因在这里。
    repeated RanchProduce produces = 5;
}

// TriggerProduce —— 请求空，响应 RanchInfo
message TriggerProduceRequest {}
message TriggerProduceReply {
    repeated RanchInfo ranches = 1;
}

// 动物引用（多个方法共用的 {ranch_inst_id, animal_inst_id} 二元组）
message AnimalRef {
    int64 ranch_inst_id = 1;
    int64 animal_inst_id = 2;
}

// StealProduce —— 1:<host_gid> [2:<target>]
// 抓包两种形态：不带 target（偷全部可偷）和带 target（指定偷某只）。
message StealProduceRequest {
    int64 host_gid = 1;       // 被偷者的 gid（好友）
    AnimalRef target = 2;     // 可选
}
message StealProduceReply {
    repeated RanchInfo ranches = 1;
}

// PlaceAnimal —— 把背包里的动物放进栏舍
// 实测 1:{1:ranch_inst_id, 2:animal_id}，animal_id 是动物种类(60001)而非实例号，
// 服务端自行分配 slot。
message PlaceTarget {
    int64 ranch_inst_id = 1;  // 10001
    int64 animal_id = 2;      // 60001
}
message PlaceAnimalRequest {
    repeated PlaceTarget targets = 1;
}
message PlaceAnimalReply {
    repeated RanchInfo ranches = 1;
}

// StrokeAnimal —— 抚摸动物（重量/变异交互）
// 实测 1:<host_gid> 2:{ranch_inst_id, animal_inst_id}
message StrokeAnimalRequest {
    int64 host_gid = 1;
    AnimalRef target = 2;
}
message StrokeAnimalReply {
    repeated RanchInfo ranches = 1;
}

// ─────────────────────────── RanchService ───────────────────────────

// CleanAllRanch —— 请求 1:<host_gid> 2:<empty>，响应 RanchInfo
message CleanAllRanchRequest {
    int64 host_gid = 1;       // 1284168173
    repeated int64 ranch_inst_ids = 2;
}
message CleanAllRanchReply {
    repeated RanchInfo ranches = 1;
}

// CleanRanch —— 定点清理指定灾害
// 实测 hex `08 <host_gid> 12 01 0b`：field 2 是 packed varint 列表，值为 [11]，
// 对应 RanchInfo.hazards[].hazard_id。与 CleanAllRanch 的区别就是能不能指名。
message CleanRanchRequest {
    int64 host_gid = 1;
    repeated int64 hazard_ids = 2;   // RanchInfo.hazards[].hazard_id
}
message CleanRanchReply {
    repeated RanchInfo ranches = 1;
}

// GetRanchOpTimes —— 请求 1:<empty>，响应 OpQuota 列表
message GetRanchOpTimesRequest {
    repeated int64 op_ids = 1;
}
message GetRanchOpTimesReply {
    repeated OpQuota quotas = 1;
}

// 收取副产品（货架上的蛋/奶）。
//
// 2026-11-17 结论：**这个方法不存在，CollectProduce 不是官方接口。**
//
// 两次官方客户端 HAR 全量扫描（Windows 微信 1.17.0.3）：
//   1. 160 秒正常游玩 → 368/369 帧解析成功、70 种接口，无 CollectProduce
//   2. 明确操作「催产」+「捡蛋」各两次 → 抓到 TriggerProduce 与 HarvestRanch
//      交替出现，仍然没有 CollectProduce
//
// 第二份抓包的服务端回包说明了一切：HarvestRanch 之后 `animal_count` 始终是 4，
// 动物一只没少，而 `produce_count` 变成了 1。也就是说
// **HarvestRanch 自己就负责捡蛋**，它按动物状态决定行为：
//   生产中(stage 3) → 只交产物，动物留栏
//   可收获(stage 5) → 收出栏
// 早先「收货架把三只鸡全收出栏」是因为那三只当时正处于可收获状态，
// 不是接口用错了。
//
// 这也解释了为什么 CollectProduce 无论发什么字段组合都返回 1020002 ——
// 网关根本没有这个方法。定义先保留（无调用点），仅作为记录。
message CollectProduceRequest {
    repeated int64 ranch_inst_ids = 1;
}
message CollectProduceReply {
    repeated RanchInfo ranches = 1;
}

service AnimalService {
    rpc GetRanchDetail(GetRanchDetailRequest) returns (GetRanchDetailReply);
    rpc FeedAnimal(FeedAnimalRequest) returns (FeedAnimalReply);
    rpc HarvestRanch(HarvestRanchRequest) returns (HarvestRanchReply);
    rpc TriggerProduce(TriggerProduceRequest) returns (TriggerProduceReply);
    rpc CollectProduce(CollectProduceRequest) returns (CollectProduceReply);
    rpc StealProduce(StealProduceRequest) returns (StealProduceReply);
    rpc PlaceAnimal(PlaceAnimalRequest) returns (PlaceAnimalReply);
}

service RanchService {
    rpc CleanAllRanch(CleanAllRanchRequest) returns (CleanAllRanchReply);
    rpc CleanRanch(CleanRanchRequest) returns (CleanRanchReply);
    rpc StrokeAnimal(StrokeAnimalRequest) returns (StrokeAnimalReply);
    rpc GetRanchOpTimes(GetRanchOpTimesRequest) returns (GetRanchOpTimesReply);
}

